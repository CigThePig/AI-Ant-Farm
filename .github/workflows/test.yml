name: Colony checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: mkdir -p test-artifacts && npm run soak -- --seconds=3600 > test-artifacts/hour-soak.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colony-simulation-results
          path: test-artifacts/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colony-browser-evidence
          path: test-artifacts/
